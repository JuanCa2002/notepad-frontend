<div class="flex flex-row justify-content-center" [style.backgroundColor]="'#e9b10c'">
    <h3 class="text-center font-bold text-bluegray-50">MY NOTES</h3>
</div>
<div class="flex flex-column p-3">
    <div class="flex justify-content-end gap-2">
        <p-button 
            icon="pi pi-arrow-right-arrow-left" 
            severity="help"
            title="Change category of the selected notes"
            (onClick)="changeCategory()">
        </p-button>
        <p-button 
            icon="pi pi-unlock" 
            severity="warning"
            title="Change state of the selected notes"
            (onClick)="changeState()">
        </p-button>
        <p-button 
            icon="pi pi-trash" 
            severity="danger"
            title="Delete selected notes"
            (onClick)="openConfirmDeleteNotes()">
        </p-button>
        <p-button 
            icon="pi pi-search" 
            severity="secondary" 
            title="Show detail of just one note"
            [outlined]="true" 
            (onClick)="showDetailDialog()">
        </p-button>
        <p-button 
            icon="pi pi-pencil" 
            severity="info"
            title="Edit just one note"
            (onClick)="showEditDialog()">
        </p-button>
        <p-button 
            icon="pi pi-plus" 
            severity="success"
            title="Create a new note"
            (onClick)="showDialog()">
        </p-button>
    </div>
</div>
<app-notes-data-view #dataView></app-notes-data-view>
<app-notes-dialog-create #createDialog (onReset)="resetData()"></app-notes-dialog-create>
<app-notes-dialog-change-category #changeCategoryDialog (onReset)="resetData()"></app-notes-dialog-change-category>
